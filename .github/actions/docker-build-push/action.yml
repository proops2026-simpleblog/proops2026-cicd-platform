name: "Docker Build and Push"
description: "Build a Docker image; push it to GHCR, or write it to a tarball for kind (IRD-011 §6)"

inputs:
  image-name:
    description: "Full image name without tag (e.g. org/service-name)"
    required: true
  image-tag:
    description: "Image tag — use the 7-char commit SHA"
    required: true
  push:
    description: "Push to registry (true) or build only (false)"
    required: false
    default: "false"
  tarball-path:
    description: "When not pushing: write the image to this tar (type=docker) for `kind load image-archive`"
    required: false
    default: ""
  registry-username:
    description: "Registry username"
    required: false
  registry-password:
    description: "Registry password / token"
    required: false

runs:
  using: "composite"
  steps:
    # Third-party actions pinned to full commit SHA (IRD-011 §4: tags can be re-pointed)
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Login to GHCR
      if: inputs.push == 'true'
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ inputs.registry-username }}
        password: ${{ inputs.registry-password }}

    - name: Build and push
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        push: ${{ inputs.push }}
        outputs: ${{ inputs.push != 'true' && inputs.tarball-path != '' && format('type=docker,dest={0}', inputs.tarball-path) || '' }}
        tags: ghcr.io/${{ inputs.image-name }}:${{ inputs.image-tag }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
