name: "Build App"
description: "Setup Node.js, install dependencies, run lint and/or tests"

inputs:
  node-version:
    description: "Node.js version"
    required: false
    default: "20"
  working-directory:
    description: "Where to run the build"
    required: false
    default: "."
  run-lint:
    description: "Run npm run lint"
    required: false
    default: "true"
  run-test:
    description: "Run npm run test:ci"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: "npm"
        cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

    - name: Install
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm ci

    - name: Lint
      if: inputs.run-lint == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm run lint

    - name: Test
      if: inputs.run-test == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm run test:ci
