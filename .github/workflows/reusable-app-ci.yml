name: Reusable App CI

# IRD-011 §4–§8 + §13 (v1.2). Node service CI:
#   lint ∥ test → sonar · build-image → deploy (kind) · ci-ok (the one required check, D4)
# New inputs default to the original v1 behaviour (IRD-011 §13.1 Compatibility).

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "20"
      image-name:
        description: "Image name without registry/tag, lowercase (e.g. org/service-name)"
        type: string
        required: true
      image-tag:
        description: "Image tag. Empty = 7-char commit SHA (IRD-011 §6)"
        type: string
        default: ""
      push-image:
        description: "Push to GHCR (main / workflow_dispatch). false = PR: build to a tarball, never push"
        type: boolean
        default: false
      # --- test job ---
      test-script:
        description: "npm script that runs tests and writes coverage/lcov.info"
        type: string
        default: "test:ci"
      db-name:
        description: "Postgres database the tests run against"
        type: string
        default: "content_db"
      test-secrets:
        description: "Space-separated env var names that get a fresh random, masked value per run (IRD-011 §8)"
        type: string
        default: ""
      test-env:
        description: "Extra non-secret KEY=VALUE lines for the test job (one per line)"
        type: string
        default: ""
      # --- sonar job ---
      run-sonar:
        description: "Run the Sonar scan. It also skips while org var SONAR_HOST_URL is unset and on fork PRs"
        type: boolean
        default: true
      # --- deploy job ---
      deploy-kind:
        description: "Deploy the built image to a throwaway kind cluster and assert the running image (IRD-011 §7)"
        type: boolean
        default: false
      service-name:
        description: "Deployment name in the k8s manifests (required when deploy-kind is true)"
        type: string
        default: ""
      manifests-repo:
        description: "Repo holding k8s/base + k8s/create-secrets.sh (IRD-007)"
        type: string
        default: "proops2026-simpleblog/docs"
      k8s-namespace:
        type: string
        default: "blogcms"
    secrets:
      SONAR_TOKEN:
        required: false

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: proops2026-simpleblog/proops2026-cicd-platform/.github/actions/build-app@feature/dat/platform-v1.2
        with:
          node-version: ${{ inputs.node-version }}
          run-lint: "true"
          run-test: "false"

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Throwaway Postgres: trust auth, no password to store (IRD-011 §5)
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ${{ inputs.db-name }}
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres@localhost:5432/${{ inputs.db-name }}
    steps:
      - uses: actions/checkout@v7
      # IRD-011 §8: test credentials generated per run, masked, never a literal in YAML
      - name: Per-run test env
        if: inputs.test-secrets != '' || inputs.test-env != ''
        shell: bash
        env:
          TEST_SECRETS: ${{ inputs.test-secrets }}
          TEST_ENV: ${{ inputs.test-env }}
        run: |
          set -euo pipefail
          for name in $TEST_SECRETS; do
            [[ "$name" =~ ^[A-Z_][A-Z0-9_]*$ ]] || { echo "::error::bad env name: $name"; exit 1; }
            value=$(openssl rand -hex 24)
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            [[ "$line" =~ ^[A-Z_][A-Z0-9_]*= ]] || { echo "::error::test-env line must be KEY=VALUE"; exit 1; }
            echo "$line" >> "$GITHUB_ENV"
          done <<< "$TEST_ENV"
      - uses: proops2026-simpleblog/proops2026-cicd-platform/.github/actions/build-app@feature/dat/platform-v1.2
        with:
          node-version: ${{ inputs.node-version }}
          run-lint: "false"
          run-test: "true"
          test-script: ${{ inputs.test-script }}
      # The scanner reads coverage; it never runs tests
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 1

  sonar:
    # Skips when disabled by input, while Sonar is not configured, and on fork PRs (no secrets)
    if: >-
      inputs.run-sonar && vars.SONAR_HOST_URL != '' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [test]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history: blame + new-code detection
      - uses: actions/download-artifact@v8
        with:
          name: coverage
          path: coverage
      - uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          args: >-
            -Dsonar.qualitygate.wait=true
            ${{ vars.SONAR_ORGANIZATION && format('-Dsonar.organization={0}', vars.SONAR_ORGANIZATION) || '' }}

  build-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [lint, test]
    permissions:
      contents: read
      packages: write # the only job that can push to GHCR
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      # IRD-011 §6: ghcr.io/<name>:<sha7>. On pull_request GITHUB_SHA is a temporary merge
      # commit, so that image is never pushed (tarball only)
      - id: meta
        shell: bash
        env:
          NAME: ${{ inputs.image-name }}
          TAG: ${{ inputs.image-tag }}
        run: |
          set -euo pipefail
          echo "image=ghcr.io/${NAME,,}:${TAG:-${GITHUB_SHA::7}}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG:-${GITHUB_SHA::7}}" >> "$GITHUB_OUTPUT"
      - uses: proops2026-simpleblog/proops2026-cicd-platform/.github/actions/docker-build-push@feature/dat/platform-v1.2
        with:
          image-name: ${{ inputs.image-name }}
          image-tag: ${{ steps.meta.outputs.tag }}
          push: ${{ inputs.push-image }}
          tarball-path: ${{ !inputs.push-image && inputs.deploy-kind && format('{0}/image.tar', runner.temp) || '' }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
      - if: ${{ !inputs.push-image && inputs.deploy-kind }}
        uses: actions/upload-artifact@v7
        with:
          name: image
          path: ${{ runner.temp }}/image.tar
          retention-days: 1

  deploy:
    if: inputs.deploy-kind
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [build-image]
    permissions:
      contents: read
      packages: read # pull the pushed image from GHCR inside kind
    defaults:
      run:
        shell: bash # -eo pipefail
    env:
      IMAGE: ${{ needs.build-image.outputs.image }}
      NS: ${{ inputs.k8s-namespace }}
      SERVICE: ${{ inputs.service-name }}
    steps:
      - name: Check inputs
        run: '[ -n "$SERVICE" ] || { echo "::error::service-name is required when deploy-kind is true"; exit 1; }'

      # Manifests live in the docs repo (IRD-007), not in the service repo
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.manifests-repo }}
          path: docs

      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: ci-${{ github.run_id }}
          wait: 120s

      - name: Create Secrets (random values, cluster dies with the job)
        run: bash docs/k8s/create-secrets.sh # committed 100644, so bash

      # PR: the image was never pushed — load the tarball built by build-image
      - name: Download the PR image
        if: ${{ !inputs.push-image }}
        uses: actions/download-artifact@v8
        with:
          name: image
          path: ${{ runner.temp }}
      - name: Load the PR image into kind
        if: ${{ !inputs.push-image }}
        run: kind load image-archive "$RUNNER_TEMP/image.tar" --name "ci-$GITHUB_RUN_ID"

      # main: the cluster pulls the pushed image from GHCR (package is private)
      - name: Let the cluster pull from GHCR
        if: inputs.push-image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          kubectl create secret docker-registry ghcr-pull -n "$NS" \
            --docker-server=ghcr.io --docker-username="$GITHUB_ACTOR" \
            --docker-password="$GHCR_TOKEN" --dry-run=client -o yaml | kubectl apply -f -
          kubectl patch serviceaccount default -n "$NS" \
            -p '{"imagePullSecrets":[{"name":"ghcr-pull"}]}'

      # CI overlay = base + this commit's image; only postgres + this service run.
      # Other Deployments are listed from base (kustomize regex has no lookahead).
      - name: Build CI overlay
        run: |
          set -euo pipefail
          OTHERS=$(kubectl kustomize docs/k8s/base \
            | yq -N 'select(.kind == "Deployment") | .metadata.name' \
            | grep -vxE "postgres|${SERVICE}" | paste -sd'|' -)
          mkdir -p docs/k8s/overlays/ci
          cat > docs/k8s/overlays/ci/kustomization.yaml <<YAML
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          resources:
            - ../../base
          images:
            - name: ${SERVICE}
              newName: ${IMAGE%:*}
              newTag: "${IMAGE##*:}"
          patches:
            - target: { kind: Deployment, name: ${SERVICE} }
              patch: |-
                - op: replace
                  path: /spec/template/spec/containers/0/imagePullPolicy
                  value: IfNotPresent
          YAML
          if [ -n "$OTHERS" ]; then
            cat >> docs/k8s/overlays/ci/kustomization.yaml <<YAML
            - target: { kind: Deployment, name: "^(${OTHERS})\$" }
              patch: |-
                \$patch: delete
                apiVersion: apps/v1
                kind: Deployment
                metadata: { name: unused }
          YAML
          fi
          kubectl kustomize docs/k8s/overlays/ci | grep -E '^kind: Deployment|image:'

      - name: Apply manifests
        run: kubectl apply -k docs/k8s/overlays/ci

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/postgres -n "$NS" --timeout=120s
          kubectl rollout status "deployment/$SERVICE" -n "$NS" --timeout=180s

      # IRD-011 §7.6: rollout status alone is not proof — every Pod must run the built image
      - name: Assert running image
        run: |
          kubectl get pods -n "$NS" -o wide
          kubectl get pods -n "$NS" -l "app=$SERVICE" \
            -o jsonpath='{range .items[*]}{.spec.containers[0].image}{"\n"}{end}' | grep -qx "$IMAGE"

      - name: Diagnose (only on failure)
        if: failure()
        run: |
          kubectl get pods,events -n "$NS" --sort-by=.lastTimestamp || true
          kubectl describe pod -n "$NS" -l "app=$SERVICE" || true
          kubectl logs -n "$NS" -l "app=$SERVICE" --all-containers --tail=50 || true

  # IRD-011 D4: the one required check, "<caller job id> / ci-ok" (callers use job id `ci`).
  # Fails unless every job succeeded or was skipped (by input / missing Sonar config).
  ci-ok:
    if: always()
    needs: [lint, test, sonar, build-image, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: All jobs passed
        shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needs results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "::error::a needed job ended '$r'"; exit 1;; esac
          done
