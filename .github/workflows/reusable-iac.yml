name: Reusable IaC

# IRD-011 §13.3 (v1.2): terraform init → validate → plan → apply the saved plan, for one env dir.
# AWS auth (IRD-011 §8, D11):
#   OIDC (required by IRD-011): pass aws-role-arn; the caller grants `permissions: id-token: write`.
#   Static keys: kept only so v1 callers stay compatible (§13.1); not allowed for new callers.
# New inputs default to the original v1 behaviour.

on:
  workflow_call:
    inputs:
      action:
        description: "plan | apply | destroy"
        type: string
        required: true
      environment:
        description: "dev | test | prod"
        type: string
        default: "dev"
      working-directory:
        description: "Terraform root config directory"
        type: string
        default: "iac/dev"
      aws-region:
        type: string
        default: "ap-southeast-1"
      aws-role-arn:
        description: "IAM role to assume via GitHub OIDC (empty = static key secrets, legacy)"
        type: string
        default: ""
      backend-bucket:
        description: "S3 state bucket for a partial backend config (empty = backend fully in code)"
        type: string
        default: ""
      terraform-version:
        type: string
        default: "~1.6"
    secrets:
      AWS_ACCESS_KEY_ID:
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false
      TF_VAR_PREFIX:
        required: false
      TF_VAR_PROJECT:
        required: false
      TF_VAR_REGION_CODE:
        required: false
      TF_VAR_REGION:
        required: false
      TF_VAR_RESPONSIBLE_PARTY:
        required: false
      TF_VAR_OWNER:
        required: false
      TF_VAR_EMAIL:
        required: false

# No permissions block on purpose: jobs inherit the caller's token permissions.
# Declaring id-token: write here would break v1 static-key callers that don't grant it.

jobs:
  iac:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # One run per repo+env at a time, never cancelled: two applies on one state fight over the lock
    concurrency:
      group: iac-${{ github.repository }}-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check inputs
        working-directory: .
        env:
          ACTION: ${{ inputs.action }}
        run: |
          case "$ACTION" in plan|apply|destroy) ;; *) echo "::error::action must be plan|apply|destroy, got '$ACTION'"; exit 1;; esac

      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false

      - name: AWS credentials (OIDC)
        if: inputs.aws-role-arn != ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ inputs.aws-role-arn }}
          role-session-name: gha-${{ github.run_id }}
          aws-region: ${{ inputs.aws-region }}

      - name: AWS credentials (static keys, legacy v1 callers only)
        if: inputs.aws-role-arn == ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.aws-region }}

      - name: Init
        env:
          BACKEND_BUCKET: ${{ inputs.backend-bucket }}
        run: |
          if [ -n "$BACKEND_BUCKET" ]; then
            terraform init -no-color -backend-config="bucket=$BACKEND_BUCKET"
          else
            terraform init -no-color
          fi

      - name: Validate
        run: terraform validate -no-color

      # The only step that reads variables, so the TF_VAR_* secrets are mapped here only
      # (IRD-011 §8). terraform.tfvars beats TF_VAR_*, so these fill only what the env
      # dir doesn't commit (owner, email, responsible_party — D10). destroy is planned
      # too, so the log shows exactly what will be removed.
      - name: Plan
        env:
          ACTION: ${{ inputs.action }}
          TF_VAR_prefix: ${{ secrets.TF_VAR_PREFIX }}
          TF_VAR_project: ${{ secrets.TF_VAR_PROJECT }}
          TF_VAR_region_code: ${{ secrets.TF_VAR_REGION_CODE }}
          TF_VAR_region: ${{ secrets.TF_VAR_REGION }}
          TF_VAR_responsible_party: ${{ secrets.TF_VAR_RESPONSIBLE_PARTY }}
          TF_VAR_owner: ${{ secrets.TF_VAR_OWNER }}
          TF_VAR_email: ${{ secrets.TF_VAR_EMAIL }}
          TF_VAR_environment: ${{ inputs.environment }}
        run: |
          if [ "$ACTION" = "destroy" ]; then
            terraform plan -no-color -destroy -out=tfplan
          else
            terraform plan -no-color -out=tfplan
          fi

      # Applying a saved plan needs no variables: they are inside tfplan
      - name: Apply
        if: inputs.action == 'apply' || inputs.action == 'destroy'
        run: terraform apply -no-color -auto-approve tfplan

      - name: Outputs
        if: inputs.action == 'apply'
        run: terraform output -no-color

  # IRD-011 D4: same stable check name as reusable-app-ci — "<caller job id> / ci-ok"
  ci-ok:
    if: always()
    needs: [iac]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: IaC job passed
        shell: bash
        env:
          RESULT: ${{ needs.iac.result }}
        run: '[ "$RESULT" = "success" ] || { echo "::error::iac job ended $RESULT"; exit 1; }'
