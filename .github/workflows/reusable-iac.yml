name: Reusable IaC

on:
  workflow_call:
    inputs:
      action:
        description: "plan | apply | destroy"
        type: string
        required: true
      environment:
        description: "dev | test | prod"
        type: string
        default: "dev"
      working-directory:
        description: "Terraform root config directory"
        type: string
        default: "iac/dev"
      aws-region:
        type: string
        default: "eu-west-2"
      # Non-sensitive TF vars — passed as inputs so they reach the job reliably
      tf-var-prefix:
        description: "Org shortcode (e.g. proops)"
        type: string
        default: ""
      tf-var-project:
        description: "Project shortcode (e.g. blogcms)"
        type: string
        default: ""
      tf-var-region:
        description: "Full AWS region (e.g. eu-west-2)"
        type: string
        default: "eu-west-2"
      tf-var-region-code:
        description: "Compact region code (e.g. euw2)"
        type: string
        default: "euw2"
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      TF_VAR_RESPONSIBLE_PARTY:
        required: false
      TF_VAR_OWNER:
        required: false
      TF_VAR_EMAIL:
        required: false

jobs:
  iac:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TF_VAR_prefix:            ${{ inputs.tf-var-prefix }}
      TF_VAR_project:           ${{ inputs.tf-var-project }}
      TF_VAR_region_code:       ${{ inputs.tf-var-region-code }}
      TF_VAR_region:            ${{ inputs.tf-var-region }}
      TF_VAR_responsible_party: ${{ secrets.TF_VAR_RESPONSIBLE_PARTY }}
      TF_VAR_owner:             ${{ secrets.TF_VAR_OWNER }}
      TF_VAR_email:             ${{ secrets.TF_VAR_EMAIL }}
      TF_VAR_environment:       ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.6"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.aws-region }}

      - name: Init
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        run: terraform init

      - name: Validate
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        run: terraform validate

      - name: Plan
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        run: terraform plan -no-color -out=tfplan

      - name: Apply
        if: inputs.action == 'apply'
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        run: terraform apply -auto-approve -no-color tfplan

      - name: Destroy
        if: inputs.action == 'destroy'
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        run: terraform destroy -auto-approve -no-color
