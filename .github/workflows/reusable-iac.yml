name: Reusable IaC

# terraform init → validate → plan → (apply | destroy) for one env directory.
# AWS auth, pick one:
#   OIDC (preferred): pass aws-role-arn; the caller job needs `permissions: id-token: write`.
#   Static keys (legacy): pass secrets AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY.
# Inputs added after the first v1 default to the original behaviour.

on:
  workflow_call:
    inputs:
      action:
        description: "plan | apply | destroy"
        type: string
        required: true
      environment:
        description: "dev | test | prod"
        type: string
        default: "dev"
      working-directory:
        description: "Terraform root config directory"
        type: string
        default: "iac/dev"
      aws-region:
        type: string
        default: "ap-southeast-1"
      aws-role-arn:
        description: "IAM role to assume via GitHub OIDC (empty = use static key secrets)"
        type: string
        default: ""
      backend-bucket:
        description: "S3 state bucket for a partial backend config (empty = backend fully in code)"
        type: string
        default: ""
      terraform-version:
        type: string
        default: "~1.6"
    secrets:
      AWS_ACCESS_KEY_ID:
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false
      TF_VAR_PREFIX:
        required: false
      TF_VAR_PROJECT:
        required: false
      TF_VAR_REGION_CODE:
        required: false
      TF_VAR_REGION:
        required: false
      TF_VAR_RESPONSIBLE_PARTY:
        required: false
      TF_VAR_OWNER:
        required: false
      TF_VAR_EMAIL:
        required: false

# No permissions block on purpose: the job inherits the caller's token permissions.
# Declaring id-token: write here would break static-key callers that don't grant it.

jobs:
  iac:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # One run per env at a time — two applies on one state would fight over the lock
    concurrency:
      group: iac-${{ github.repository }}-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      # terraform.tfvars beats TF_VAR_* env vars, so these only fill values the env dir
      # does not commit (owner, email, responsible_party). An unpassed secret = "".
      TF_VAR_prefix: ${{ secrets.TF_VAR_PREFIX }}
      TF_VAR_project: ${{ secrets.TF_VAR_PROJECT }}
      TF_VAR_region_code: ${{ secrets.TF_VAR_REGION_CODE }}
      TF_VAR_region: ${{ secrets.TF_VAR_REGION }}
      TF_VAR_responsible_party: ${{ secrets.TF_VAR_RESPONSIBLE_PARTY }}
      TF_VAR_owner: ${{ secrets.TF_VAR_OWNER }}
      TF_VAR_email: ${{ secrets.TF_VAR_EMAIL }}
      TF_VAR_environment: ${{ inputs.environment }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check inputs
        working-directory: .
        env:
          ACTION: ${{ inputs.action }}
        run: |
          case "$ACTION" in plan|apply|destroy) ;; *) echo "::error::action must be plan|apply|destroy, got '$ACTION'"; exit 1;; esac

      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false

      - name: AWS credentials (OIDC)
        if: inputs.aws-role-arn != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.aws-role-arn }}
          role-session-name: gha-${{ github.run_id }}
          aws-region: ${{ inputs.aws-region }}

      - name: AWS credentials (static keys)
        if: inputs.aws-role-arn == ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.aws-region }}

      - name: Init
        env:
          BACKEND_BUCKET: ${{ inputs.backend-bucket }}
        run: |
          if [ -n "$BACKEND_BUCKET" ]; then
            terraform init -no-color -backend-config="bucket=$BACKEND_BUCKET"
          else
            terraform init -no-color
          fi

      - name: Validate
        run: terraform validate -no-color

      # destroy is planned too, so the log shows exactly what will be removed
      - name: Plan
        env:
          ACTION: ${{ inputs.action }}
        run: |
          if [ "$ACTION" = "destroy" ]; then
            terraform plan -no-color -destroy -out=tfplan
          else
            terraform plan -no-color -out=tfplan
          fi

      - name: Apply
        if: inputs.action == 'apply' || inputs.action == 'destroy'
        run: terraform apply -no-color -auto-approve tfplan

      - name: Outputs
        if: inputs.action == 'apply'
        run: terraform output -no-color
